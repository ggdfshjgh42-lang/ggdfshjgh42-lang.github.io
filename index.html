<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="奥斯拖拉机斯基 - 博客与小游戏">
    <title>奥斯拖拉机斯基 | Fantastic Matrix</title>
    <style>
        :root {
            --bg: #fafafa;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-muted: #999;
            --accent: #2d2d2d;
            --border: #ebebeb;
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.75;
            overflow-x: hidden;
            padding-top: 72px;
        }

        /* ---- Nav ---- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(250, 250, 250, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .nav-inner {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.5px;
            color: var(--text);
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: var(--text);
        }

        /* ---- Layout ---- */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 32px;
        }

        section {
            padding: 80px 0 40px;
        }

        /* ---- Section Titles ---- */
        .section-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 32px;
            line-height: 1.3;
        }

        /* ======== Blog ======== */
        .blog-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .blog-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
        }
        .blog-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            border-color: var(--text);
        }
        .blog-card-date {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .blog-card-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            line-height: 1.4;
        }
        .blog-card-excerpt {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .blog-card-tags {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .blog-tag {
            font-size: 12px;
            padding: 4px 12px;
            background: #f3f3f3;
            border-radius: 20px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Blog Post View */
        #blog-post {
            display: none;
        }
        #blog-post.active {
            display: block;
        }
        .post-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 24px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .post-back:hover {
            color: var(--text);
        }
        .post-title {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.3;
            margin-bottom: 16px;
        }
        .post-meta {
            font-size: 14px;
            color: var(--text-muted);
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 40px;
        }
        .post-body {
            font-size: 17px;
            line-height: 2;
            color: var(--text);
        }
        .post-body h3 {
            font-size: 22px;
            margin: 40px 0 16px;
            font-weight: 700;
        }
        .post-body p {
            margin-bottom: 20px;
            color: #333;
        }
        .post-body blockquote {
            border-left: 3px solid var(--border);
            padding-left: 20px;
            margin: 24px 0;
            color: var(--text-secondary);
            font-style: italic;
        }
        .post-body img {
            max-width: 100%;
            border-radius: var(--radius);
            margin: 24px 0;
        }

        #blog-list.hidden {
            display: none;
        }

        /* ---- Footer ---- */
        footer {
            border-top: 1px solid var(--border);
            padding: 32px 0;
            text-align: center;
            margin-top: 40px;
        }
        footer p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ---- Responsive ---- */
        @media (max-width: 640px) {
            section { padding: 60px 0 30px; }
            .nav-links { gap: 16px; }
            .nav-links a { font-size: 13px; }
            .post-title { font-size: 28px; }
            .blog-card-title { font-size: 18px; }
            .blog-card { padding: 24px; }
            .section-title { font-size: 26px; }
        }
        @media (max-width: 360px) {
            .nav-inner { padding-left: 16px; padding-right: 16px; gap: 8px; }
            .nav-logo { font-size: 16px; white-space: nowrap; }
            .nav-links { gap: 10px; }
            .nav-links a { white-space: nowrap; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav id="navbar">
        <div class="nav-inner">
            <a href="/" class="nav-logo">奥斯拖拉机斯基</a>
            <ul class="nav-links">
                <li><a href="/">博客</a></li>
                <li><a href="optics-roadmap.html">光学学习</a></li>
                <li><a href="gomoku.html">小游戏</a></li>
            </ul>
        </div>
    </nav>

    <!-- Blog -->
    <section id="blog">
        <div class="container">
            <p class="section-label">博客</p>
            <h2 class="section-title">随便写写</h2>

            <!-- Blog List -->
            <div id="blog-list" class="blog-list"><p role="status">正在加载文章…</p></div>

            <!-- Blog Post (hidden by default) -->
            <div id="blog-post">
                <a href="/" class="post-back" id="post-back-btn">&larr; 返回博客列表</a>
                <div class="post-header">
                    <h1 class="post-title" id="post-title"></h1>
                    <div class="post-meta">
                        <span id="post-date"></span>
                        <span>·</span>
                        <span id="post-tags-display"></span>
                    </div>
                </div>
                <div class="post-body" id="post-body"></div>
                <div style="margin-top: 48px; padding-top: 32px; border-top: 1px solid var(--border);">
                    <a href="/" class="post-back">&larr; 返回博客列表</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p id="site-footer">&copy; 2026 fantasticmatrix.xyz — 奥斯拖拉机斯基</p>
            <p><a href="admin.html" style="color: inherit;">内容管理</a></p>
        </div>
    </footer>

    <script src="content.js" defer></script>
    <script src="blog.js" defer></script>
</body>
</html>
